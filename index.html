<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planer budżetu domowego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container mt-4">
        <h1>Planer budżetu domowego</h1>

        <h2 class="mt-4">Dodaj operację</h2>

        <form id="formularz">
            <div class="row">
                <div class="col-12 col-md-6 mb-3">
                    <label for="opis" class="form-label">Opis</label>
                    <input type="text" id="opis" class="form-control"placeholder="np. Zakupy spożywcze">
                        <div class="invalid-feedback">Wpisz opis operacji.</div>
                </div>

                <div class="col-12 col-md-6 mb-3">
                    <label for="kwota" class="form-label">Kwota (zł)</label>
                    <input type="text" id="kwota" class="form-control" placeholder="np. 49,99">
                    <div class="invalid-feedback">
                        Kwota musi być większa od 0 i mieć max dwa miejsca po przecinku.
                    </div>
                </div>

                <div class="col-12 col-md-6 mb-3">
                    <label for="typ" class="form-label">Typ operacji</label>
                    <select id="typ" class="form-select">
                        <option value="wydatek">Wydatek</option>
                        <option value="przychod">Przychód</option>
                    </select>
                </div>

                <div class="col-12 col-md-6 mb-3">
                    <label for="kategoria" class="form-label">Kategoria</label>
                    <select id="kategoria" class="form-select">
                        <option value="zywnosc">Żywność</option>
                        <option value="mieszkanie">Mieszkanie</option>
                        <option value="transport">Transport</option>
                        <option value="rozrywka">Rozrywka</option>
                        <option value="zdrowie">Zdrowie</option>
                        <option value="wynagrodzenie">Wynagrodzenie</option>
                        <option value="inne">Inne</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="zapiszOperacje" class="btn btn-primary">
                Dodaj
            </button>

            <button type="button" id="anulujEdycje" class="btn btn-secondary d-none">
                Anuluj
            </button>
        </form>
        <h2 class="mt-4">Podsumowanie</h2>

        <div class="row">
            <div class="col-12 col-md-4 mb-3">
                <div class="card p-3">
                    <strong>Przychody</strong>
                    <span id="sumaPrzychodow" class="text-success">0,00 zł</span>
                </div>
            </div>

            <div class="col-12 col-md-4 mb-3">
                <div class="card p-3">
                    <strong>Wydatki</strong>
                    <span id="sumaWydatkow" class="text-danger">0,00 zł</span>
                </div>
            </div>

            <div class="col-12 col-md-4 mb-3">
                <div class="card p-3">
                    <strong>Saldo</strong>
                    <span id="saldo">0,00 zł</span>
                </div>
            </div>
        </div>
        <h2 class="mt-4">Operacje</h2>
        <div class="row g-2 mb-3">
            <div class="col-auto">
                <label for="filtrTypu" class="form-label">Typ operacji</label>
                <select id="filtrTypu" class="form-select form-select-sm">
                    <option value="">Wszystkie typy</option>
                    <option value="przychod">Przychód</option>
                    <option value="wydatek">Wydatek</option>
                </select>
            </div>

            <div class="col-auto">
                <label for="filtrKategorii" class="form-label">Kategoria</label>
                <select id="filtrKategorii" class="form-select form-select-sm">
                    <option value="">Wszystkie kategorie</option>
                </select>
            </div>
            
            <div class="col-auto">
                <label for="sortowanie" class="form-label">Sortowanie po kwocie</label>
                <select id="sortowanie" class="form-select form-select-sm">
                    <option value="">Kolejność dodania</option>
                    <option value="rosnaco">Od najmniejszej kwoty</option>
                    <option value="malejaco">Od największej kwoty</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Opis</th>
                        <th>Kategoria</th>
                        <th>Kwota</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody id="listaOperacji"></tbody>
            </table>
        </div>
        <h2 class="mt-4">Wydatki według kategorii</h2>
            <div id="wydatkiKategorie">
                <p>Brak wydatków.</p>
            </div>
    </main>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
